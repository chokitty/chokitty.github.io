{% extends "layout.html" %}
{% block body %}
<header>
    <h1>Change Password for ID: {{student_id}}</h1>
</header>
<main>
    {% if ps_message %}
    <div style="color:red;">
        <p>{{ ps_message }}</p>
    </div>
    {% endif %}
    <form id="changePasswordForm" method="POST" action="/change_password">

        <label for="old_password">Old Password:</label>
        <input type="password" id="old_password" name="old_password" required><br>

        <p>Mat khau moi phai bao gom it nhat mot chu viet hoa, mot so va mot ki tu dac biet</p>
        <label for="new_password">New Password:</label>
        <input type="password" id="new_password" name="new_password" required><br>
        <button type="button" onclick="togglePasswordVisibility('new_password')">👁️</button><br>

        <label for="confirm_password">Confirm New Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required><br>
        <button type="button" onclick="togglePasswordVisibility('confirm_password')">👁️</button><br>

        <button type="button" onclick="validatePassword()">CHANGE</button>
    </form>
    <p id="error_message" style="color:red;"></p>
    {% if message %}
    <p>{{ message }}</p>
    {% endif %}
    <button onclick="location.href='/home'">HOME</button>
</main>

<script>
    function togglePasswordVisibility(fieldId) {
        var field = document.getElementById(fieldId);
        if (field.type === "password") {
            field.type = "text";
        } else {
            field.type = "password";
        }
    }

    function validatePassword() {
        var oldPassword = document.getElementById("old_password").value;
        var newPassword = document.getElementById("new_password").value;
        var confirmPassword = document.getElementById("confirm_password").value;
        var errorMessage = document.getElementById("error_message");

        var passwordPattern = /^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.*[0-9]).{8,}$/;

        if (newPassword === oldPassword) {
            errorMessage.textContent = "New password must be different from the old password.";
            return;
        }
        if (!passwordPattern.test(newPassword)) {
            errorMessage.textContent = "New password must include at least one capital letter, one special symbol, and one number.";
            return;
        }
        if (newPassword !== confirmPassword) {
            errorMessage.textContent = "New passwords do not match. Please try again.";
            return;
        }
        errorMessage.textContent = ""; // Clear the error message
        document.getElementById("changePasswordForm").submit();
    }

    document.getElementById("new_password").addEventListener("input", function() {
        document.getElementById("error_message").textContent = "";
    });

    document.getElementById("confirm_password").addEventListener("input", function() {
        document.getElementById("error_message").textContent = "";
    });
</script>
{% endblock %}
